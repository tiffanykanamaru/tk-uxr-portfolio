  document.querySelectorAll('[data-copy-email]').forEach(function (btn) {
    var tip = btn.querySelector('.icon-tooltip');
    var defaultText = tip.textContent;
    btn.addEventListener('click', function () {
      navigator.clipboard.writeText(btn.getAttribute('data-copy-email'));
      tip.textContent = 'Copied!';
      setTimeout(function () { tip.textContent = defaultText; }, 1500);

<script>
  var photos = [
    { src: 'images/placeholder-1.svg', alt: 'Photo of Tiffany', caption: 'Add a caption for this photo here.' },
    { src: 'images/placeholder-2.svg', alt: 'Photo of Tiffany', caption: 'Add a caption for this photo here.' },
    { src: 'images/placeholder-3.svg', alt: 'Photo of Tiffany', caption: 'Add a caption for this photo here.' },
    { src: 'images/placeholder-4.svg', alt: 'Photo of Tiffany', caption: 'Add a caption for this photo here.' }
  ];
  var stack = document.getElementById('polaroid-stack');
  var swiping = false;

  function renderStack() {
    stack.innerHTML = '';
    var visibleCount = Math.min(photos.length, 3);
    for (var i = 0; i < visibleCount; i++) {
      var photo = photos[i];
      var card = document.createElement('div');
      card.className = 'polaroid-card';
      card.setAttribute('data-pos', i);

      var photoWrap = document.createElement('div');
      photoWrap.className = 'polaroid-photo-wrap';

      var img = document.createElement('img');
      img.className = 'polaroid-photo';
      img.src = photo.src;
      img.alt = photo.alt;
      photoWrap.appendChild(img);

      if (i === 0) {
        var tag = document.createElement('span');
        tag.className = 'polaroid-swipe-tag';
        tag.innerHTML = 'Swipe <span aria-hidden="true">&rarr;</span>';
        photoWrap.appendChild(tag);

        photoWrap.addEventListener('mousemove', function (e) {
          var rect = photoWrap.getBoundingClientRect();
          tag.style.left = (e.clientX - rect.left) + 'px';
          tag.style.top = (e.clientY - rect.top) + 'px';
        });
        photoWrap.addEventListener('mouseenter', function () {
          tag.classList.add('is-visible');
        });
        photoWrap.addEventListener('mouseleave', function () {
          tag.classList.remove('is-visible');
        });
      }

      card.appendChild(photoWrap);

      var caption = document.createElement('div');
      caption.className = 'polaroid-caption';
      caption.textContent = photo.caption;
      card.appendChild(caption);

      if (i === 0) {
        card.setAttribute('role', 'button');
        card.setAttribute('tabindex', '0');
        card.addEventListener('click', swipeTop);
        card.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            swipeTop();
          }
        });
      }

      stack.appendChild(card);
    }
  }

  function swipeTop() {
    if (swiping) return;
    var topCard = stack.querySelector('.polaroid-card[data-pos="0"]');
    if (!topCard) return;
    swiping = true;
    topCard.classList.add('swipe-out');
    topCard.addEventListener('animationend', function handler() {
      topCard.removeEventListener('animationend', handler);
      photos.push(photos.shift());
      renderStack();
      swiping = false;
    });
  }

  renderStack();
</script>

</main>
